<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="tile" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#eaffff"/>
      <stop offset="45%" stop-color="#aef9ff"/>
      <stop offset="100%" stop-color="#3aa8c8"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aef9ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#aef9ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#aef9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- near-black indigo background -->
  <rect width="512" height="512" rx="96" fill="#0a0a1a"/>
  <!-- faint echo trail tiles fading away -->
  <rect x="96"  y="300" width="80" height="80" rx="20" fill="#aef9ff" opacity="0.10"/>
  <rect x="190" y="300" width="80" height="80" rx="20" fill="#aef9ff" opacity="0.22"/>
  <rect x="284" y="300" width="80" height="80" rx="20" fill="#aef9ff" opacity="0.40"/>
  <!-- glow + bright player tile -->
  <circle cx="256" cy="200" r="180" fill="url(#bloom)"/>
  <rect x="186" y="130" width="140" height="140" rx="34" fill="url(#tile)"/>
</svg>
