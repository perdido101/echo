<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="ECHO — survive the board as it fills with replays of your own past moves." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Echo" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>ECHO</title>
    <style>
      :root {
        --bg: #0a0a1a;
        --cyan: #aef9ff;
        --ink: #cfe9ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none; /* we handle swipes ourselves */
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo,
          Consolas, monospace;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
      }

      /* ---- HUD overlays (crisp DOM text over the canvas) ---- */
      .hud { position: fixed; pointer-events: none; z-index: 5; }

      #title {
        top: max(14px, env(safe-area-inset-top));
        left: 16px;
        font-size: 13px;
        letter-spacing: 6px;
        font-weight: 700;
        opacity: 0.32;
        color: var(--cyan);
      }

      #score {
        top: max(12px, env(safe-area-inset-top));
        left: 0;
        right: 0;
        text-align: center;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 1px;
        color: var(--ink);
        text-shadow: 0 0 18px rgba(174, 249, 255, 0.35);
        font-variant-numeric: tabular-nums;
      }

      #mute {
        top: max(12px, env(safe-area-inset-top));
        right: 14px;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        font-size: 18px;
        opacity: 0.5;
        cursor: pointer;
        pointer-events: auto;
        border-radius: 10px;
        transition: opacity 0.15s ease, background 0.15s ease;
        color: var(--cyan);
      }
      #mute:hover { opacity: 0.9; background: rgba(174, 249, 255, 0.07); }

      #hint {
        left: 0; right: 0;
        bottom: max(40px, env(safe-area-inset-bottom));
        text-align: center;
        font-size: 13px;
        letter-spacing: 1px;
        opacity: 0.5;
        transition: opacity 0.6s ease;
        color: var(--ink);
      }
      #hint.gone { opacity: 0; }

      /* ---- Game over panel ---- */
      #over {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
      #over.show { opacity: 1; pointer-events: auto; }
      #over .label { font-size: 12px; letter-spacing: 4px; opacity: 0.55; }
      #over .final { font-size: 72px; font-weight: 700; color: var(--cyan);
        text-shadow: 0 0 28px rgba(174, 249, 255, 0.45); line-height: 1; }
      #over .best { font-size: 15px; opacity: 0.7; margin-top: 2px; }
      #newbest {
        font-size: 16px; letter-spacing: 5px; font-weight: 700;
        color: #fff; opacity: 0; margin-top: 6px;
        text-shadow: 0 0 24px rgba(174, 249, 255, 0.9);
      }
      #newbest.flash { animation: flash 1.1s ease-out; opacity: 1; }
      @keyframes flash {
        0% { opacity: 0; transform: scale(0.8); filter: brightness(2.4); }
        25% { opacity: 1; transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); filter: brightness(1); }
      }
      #restart { margin-top: 22px; font-size: 13px; letter-spacing: 1px; opacity: 0.55; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="title" class="hud">ECHO</div>
    <div id="score" class="hud">0</div>
    <div id="mute" class="hud" title="Mute (M)">♪</div>
    <div id="hint" class="hud">swipe or use arrow keys / WASD to move</div>

    <div id="over">
      <div class="label">GAME OVER</div>
      <div class="final" id="final">0</div>
      <div class="best" id="bestFinal">BEST 0</div>
      <div id="newbest">NEW BEST</div>
      <div id="restart">tap / press space to restart</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
